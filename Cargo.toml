[package]
name = "msldecomp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Monster Super League IL2CPP metadata, protobuf packet schema, and passive wire analysis tools"
repository = "https://github.com/aliceblackrose/msldecomp"

[features]
default = []
native = ["dep:il2cpp_dumper_engine"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
il2cpp_dumper_engine = { package = "il2cpp_dumper", git = "https://github.com/rodroidmods/il2cpp-dumper-rs.git", rev = "8bfb90229539833999e725c5cf6402a435b47f15", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
